repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: true

      - id: a2a-contracts
        name: A2A API contracts
        entry: uv run --extra agent-strands pytest tests/unit/test_a2a_contracts.py -q
        language: system
        pass_filenames: false
        # Only run when pattern code or the test itself changes
        files: ^(patterns/|tests/unit/test_a2a_contracts\.py)
